name: Tests

# Le déploiement GitHub Pages de l'amont (CharacterStudio, domaine studio.m3org.com) est retiré :
# EGEN Character Factory est déployé à part, par image Docker (voir docs/egen/DEPLOIEMENT.md).
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm run test:run
