# EGEN : construit @civitas/esm-character-app et l'attache à une release GitHub (tag `egen-app-v<version>`),
# pour que le Core le récupère par `external-apps.json` (URL https du tarball).
name: EGEN — esm-character-app

on:
  push:
    tags: ["egen-app-v*"]
  pull_request:
    paths: ["integrations/egen/esm-character-app/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: integrations/egen/esm-character-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm test
      - run: npx tsc
      - run: npm run build
      - name: Vérifier que le tag correspond à la version du paquet
        if: startsWith(github.ref, 'refs/tags/egen-app-v')
        run: |
          v="$(node -p "require('./package.json').version")"
          test "refs/tags/egen-app-v${v}" = "${GITHUB_REF}" || { echo "tag ≠ version du package.json (${v})"; exit 1; }
      - run: npm pack
      - name: Publier le tarball dans la release
        if: startsWith(github.ref, 'refs/tags/egen-app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.tgz --title "${GITHUB_REF_NAME}" --notes "Paquet @civitas/esm-character-app, à référencer dans external-apps.json du Core." --repo "${GITHUB_REPOSITORY}"
